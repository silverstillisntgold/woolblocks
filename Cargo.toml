[package]
name = "woolblocks"
version = "0.1.0"
edition = "2024"

[dependencies]
camino = "1.1"
image = { version = "0.25", default-features = false, features = ["png"] }
rayon = "1.10"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1_smol = "1"
vfs = "0.12"
walkdir = "2.5"
zip = { version = "4", default-features = false, features = ["deflate"] }
