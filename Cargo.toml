[package]
name = "woolblocks"
version = "0.1.0"
edition = "2024"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "rayon"] }
kiddo = { version = "6.3", default-features = false, features = ["multi-threaded"] }
rayon = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1_smol = { version = "1.0", features = ["serde"] }
thiserror = "2.0"
ureq = {
  version = "3.4",
  default-features = false,
  features = [
    "json",
    "rustls",
  ]
}
xbrz-rs = { version = "0.1", features = ["large_lut"] }
zip = { version = "8.6", default-features = false, features = ["deflate"] }
